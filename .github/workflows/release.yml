name: Release

# Builds the release zip and its checksum and uploads them to a draft release. A draft makes
# no tag: GitHub tags the commit the zip was built from when the draft is published.
# A push to build/release runs it, since a manual run needs this file on the default branch.
on:
  push:
    branches: [build/release]
  workflow_dispatch:

# Read only, unless a job says otherwise.
permissions:
  contents: read

# bash -eo pipefail: a failed command anywhere in a pipeline fails its step.
defaults:
  run:
    shell: bash

# Two runs at once could pick the same version.
concurrency: release

jobs:
  # Can write only because no lesser token sees drafts, which the numbering must count. It has
  # no checkout and runs no code from the repository and no third-party action: gh alone.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # YYYY.MM.DD.N from today's date in UTC, one past the highest N among the releases,
          # drafts included, and the tags. Either list failing to read fails the step.
          releases=$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[].tag_name')
          tags=$(gh api "repos/$REPOSITORY/tags" --paginate --jq '.[].name')
          prefix="v$(date -u +%Y.%m.%d)."
          last=$(printf '%s\n%s\n' "$releases" "$tags" | awk -v p="$prefix" 'index($0, p) == 1 { n = substr($0, length(p) + 1)
              if (n ~ /^[0-9]+$/ && n + 0 > max) max = n + 0 } END { print max + 0 }')
          echo "version=${prefix#v}$((last + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The version goes into the app's Info.plist and the files' names: its shape is checked
      # before anything uses it.
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] \
            || { echo "::error::not a version of the form YYYY.MM.DD.N: $VERSION"; exit 1; }

      # The build runs the dependencies' code, so the checkout keeps no credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: make release VERSION="$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            build/dist/Tattle-${{ env.VERSION }}.zip
            build/dist/Tattle-${{ env.VERSION }}.zip.sha256
          if-no-files-found: error

  # Can write, as the version job can. It runs nothing from the repository: it checks the zip against
  # its checksum and uploads both to a draft release.
  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Pinned by commit: whatever a moved tag pointed to would run with this job's write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check the checksum
        working-directory: dist
        run: sha256sum --check --strict "Tattle-$VERSION.zip.sha256"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft made since the version job counted, by hand or by another run, is refused.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          # Not a pipe: under pipefail, grep -q leaving early could fail the writer and read as no match.
          if grep -qxF "v$VERSION" <<<"$existing"; then
            echo "::error::a release or draft named v$VERSION exists already; delete the stale draft and run again"
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Tattle $VERSION" --notes "" "dist/Tattle-$VERSION.zip" "dist/Tattle-$VERSION.zip.sha256"
          {
            echo "Draft v$VERSION from $GITHUB_SHA"
            echo
            echo '```'
            cat "dist/Tattle-$VERSION.zip.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
