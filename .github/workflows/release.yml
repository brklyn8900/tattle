name: Release

# Builds the release zip and its checksum and uploads them to a draft release. A draft makes
# no tag: GitHub tags the commit the zip was built from when the draft is published.
# A push to build/release runs it, since a manual run needs this file on the default branch.
on:
  push:
    branches: [build/release]
  workflow_dispatch:

# Read only, unless a job says otherwise.
permissions:
  contents: read

# bash -eo pipefail: a failed command anywhere in a pipeline fails its step.
defaults:
  run:
    shell: bash

# Two runs at once would build and draft the same version.
concurrency: release

jobs:
  # Reads the version the commit carries and refuses one already published. It has no checkout
  # and runs no code from the repository and no third-party action: gh and Python's plist
  # reader alone.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The version is CFBundleShortVersionString in Resources/Info.plist at the commit being
          # built, written there by the commit that prepares the release; CFBundleVersion must
          # match it. Python only reads the two values; their shape is checked here before
          # either is printed, since a line in one could read as a workflow command.
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPOSITORY/contents/Resources/Info.plist?ref=$GITHUB_SHA" > Info.plist
          values=$(python3 -I -c 'import plistlib, sys
          info = plistlib.load(open(sys.argv[1], "rb"))
          for key in ("CFBundleShortVersionString", "CFBundleVersion"):
              value = info.get(key)
              print(value if isinstance(value, str) and "\n" not in value else "")' Info.plist)
          version=$(sed -n 1p <<<"$values")
          build=$(sed -n 2p <<<"$values")
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] \
            || { echo "::error::CFBundleShortVersionString in Resources/Info.plist is not of the form YYYY.MM.DD.N"; exit 1; }
          [[ "$build" == "$version" ]] \
            || { echo "::error::CFBundleVersion in Resources/Info.plist differs from its CFBundleShortVersionString"; exit 1; }
          # A published release, or a tag, already holds this version: the commit that prepares
          # the next release writes its version in Info.plist first. Either list failing to read
          # fails the step. Drafts are not counted: a build is redone under the same version
          # until its release is published.
          releases=$(gh api "repos/$REPOSITORY/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')
          tags=$(gh api "repos/$REPOSITORY/tags" --paginate --jq '.[].name')
          # Not a pipe: under pipefail, grep -q leaving early could fail the writer and read as no match.
          if grep -qxF "v$version" <<<"$releases"$'\n'"$tags"; then
            echo "::error::v$version is published already; write the next release's version in Resources/Info.plist"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # The version names the files this job uploads: its shape is checked before any use.
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]] \
            || { echo "::error::not a version of the form YYYY.MM.DD.N: $VERSION"; exit 1; }

      # The build runs the dependencies' code, so the checkout keeps no credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: make release

      # Anyone signed in to GitHub can download a public repository's run artifacts, so the
      # untested zip is kept one day, enough for the draft job, not the default 90.
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            build/dist/Tattle-${{ env.VERSION }}.zip
            build/dist/Tattle-${{ env.VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  # Can write, to see the drafts, which no lesser token does, and to make one. It runs nothing
  # from the repository: it checks the zip against its checksum and uploads both to a draft release.
  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Pinned by commit: whatever a moved tag pointed to would run with this job's write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check the checksum
        working-directory: dist
        run: sha256sum --check --strict "Tattle-$VERSION.zip.sha256"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release or draft of this version, made by hand or by an earlier run, is refused:
          # to build it again, delete the stale draft first.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          # Not a pipe: under pipefail, grep -q leaving early could fail the writer and read as no match.
          if grep -qxF "v$VERSION" <<<"$existing"; then
            echo "::error::a release or draft named v$VERSION exists already; delete the stale draft and run again"
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Tattle $VERSION" --notes "" "dist/Tattle-$VERSION.zip" "dist/Tattle-$VERSION.zip.sha256"
          {
            echo "Draft v$VERSION from $GITHUB_SHA"
            echo
            echo '```'
            cat "dist/Tattle-$VERSION.zip.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
